[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-spiral"
version = "0.1.0"
description = "Async Python library in counter-clockwise spiral order."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["matrix_spiral*"]